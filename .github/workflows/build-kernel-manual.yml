name: Build WSL2 Kernel Manually

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag to build'
        required: true
        default: 'linux-msft-5.10.16.3'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout from Official Microsoft Repo with Full History
        uses: actions/checkout@v4
        with:
          repository: 'microsoft/WSL2-Linux-Kernel'
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential flex bison libssl-dev libelf-dev libncurses-dev dwarves

      - name: Build Kernel
        run: |
          # 不再从运行环境中复制配置，而是使用源代码中微软官方提供的WSL默认配置
          cp Microsoft/config-wsl .config
          # 直接开始编译
          make -j$(nproc) bzImage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl2-kernel
          path: arch/x86/boot/bzImage
